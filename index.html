<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Roguelike · v2.8-alpha</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<button id="btn-tema" title="Cambiar tema">🌍 Tema: Tierra</button>
<button id="btn-cheat" title="Cheat: cargar/limpiar equipables">🎁</button>
<button id="btn-jugador" title="Menú del jugador">👤 Nv.1</button>

<!-- ═══════════════════════════════════════════════════════════ -->
<!--  LAYOUT PRINCIPAL: 3 columnas (20% / 60% / 20%)             -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div id="layout">

  <!-- ─── Columna izquierda: botones de movimiento ─── -->
  <div id="col-izquierda">
    <div id="botones-movimiento">
      <div class="fila">
        <button class="btn-mover" data-dir="arriba">↑</button>
      </div>
      <div class="fila">
        <button class="btn-mover" data-dir="izquierda">←</button>
        <button class="btn-mover" data-dir="abajo">↓</button>
        <button class="btn-mover" data-dir="derecha">→</button>
      </div>
    </div>
  </div>

  <!-- ─── Columna centro: objetos arriba, mapa, barra abajo ─── -->
  <div id="col-centro">

    <!-- Slots de objetos equipados (arriba del mapa) -->
    <div id="slots-equipados">
      <div class="slot-equipado" id="slot-hacha">—</div>
      <div class="slot-equipado" id="slot-pico">—</div>
      <div class="slot-equipado" id="slot-linterna">—</div>
      <div class="slot-equipado" id="slot-barco">—</div>
    </div>

<!-- Corazones de HP (F28 fase 9) -->
<div id="hp-corazones" aria-label="Vida del jugador">
  <div id="hp-corazones-iconos"></div>
  <span id="hp-corazones-numero">20 / 20</span>
</div>

<!-- Barra de stamina (rotura) -->
<div id="barra-stamina">
  <div id="barra-stamina-relleno"></div>
</div>

    <!-- Mapa (viewport) -->
    <div id="pantalla">
      <div id="mapa"></div>
      <div id="jugador-fijo"></div>
    </div>

  </div>

  <!-- ─── Columna derecha: semilla + HUD ─── -->
  <div id="col-derecha">

    <!-- Semilla -->
    <div id="controles-semilla">
      <label>🌱 Semilla:</label>
      <input id="input-semilla" type="text" value="test_mundo_01" size="18">
      <div class="botones-semilla">
        <button id="btn-aplicar">Aplicar</button>
        <button id="btn-random">🎲</button>
      </div>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div>🏃‍♂️ Pos: <strong id="pos">0,0</strong></div>
      <div>🗺️ Zona: <strong id="zona">0</strong></div>
      <div>⭐ Nivel: <strong id="nivel-jugador">1</strong> · XP: <strong id="xp-jugador">0</strong></div>
      <div>🎒 <strong id="inventario">—</strong></div>
    </div>

    <div id="ayuda">
  WASD, flechas o botones<br>
  I: menú del jugador<br>
  <span id="ayuda-objetivo"></span>
</div>

  </div>

</div>

<!-- Overlay -->
<div id="overlay">
  <div class="titulo" id="ovTitulo"></div>
  <div class="subtitulo" id="ovSubtitulo"></div>
</div>

<script src="js/core/temas/tema-tierra.js"></script>
<script src="js/core/temas/tema-espacio.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/ruido.js"></script>
<script src="js/core/tiles.js"></script>
<script src="js/core/rng.js"></script>
<script src="js/world/biomas.js"></script>
<script src="js/world/mundo.js"></script>
<script src="js/systems/camara.js"></script>
<script src="js/core/estado.js"></script>
<script src="js/systems/progresion.js"></script>
<script src="js/world/chunks.js"></script>
<script src="js/entities/items.js"></script>
<script src="js/entities/mobs.js"></script>
<script src="js/systems/loot.js"></script>
<script src="js/entities/enemigos.js"></script>
<script src="js/systems/efectos.js"></script>
<script src="js/systems/barra-timing.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/systems/ia.js"></script>
<script src="js/entities/jugador.js"></script>
<script src="js/ui/combate-ui.js"></script>
<script src="js/systems/combate.js"></script>
<script src="js/ui/menu-jugador.js"></script>
<script src="js/ui/victoria.js"></script>
<script src="js/core/input.js"></script>
<script src="js/systems/rotura.js"></script>
<script src="js/systems/barco.js"></script>
<script src="js/systems/cheats.js"></script>
<script src="js/main.js"></script>

</body>
</html>
