<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Auditor de Semillas · Game_RPG</title>
  <link rel="stylesheet" href="auditor.css">
</head>
<body>
  <header>
    <h1>🔍 Auditor de Semillas</h1>
    <div class="controles">
      <label>Semilla
        <input type="text" id="input-semilla" value="test_mundo_01">
      </label>
      <label>Chunks al oeste
        <input type="number" id="input-oeste" value="0" min="0" max="20">
      </label>
      <label>Chunks al este
        <input type="number" id="input-este" value="10" min="1" max="50">
      </label>
      <label>Chunks a mostrar
        <select id="select-pegados">
          <option value="1" selected>1 (solo el seleccionado)</option>
          <option value="3">3 (uno a cada lado)</option>
          <option value="5">5</option>
          <option value="7">7</option>
          <option value="9">9</option>
        </select>
      </label>
      <button id="btn-generar">Generar</button>
    </div>
  </header>

  <section id="franja-chunks" class="franja"></section>

  <section id="panel-grilla" class="panel-grilla">
    <p class="vacio">Hacé click en un chunk para ver su grilla.</p>
  </section>

  <script src="../js/core/config.js"></script>
  <script src="../js/core/tiles.js"></script>
  <script src="../js/core/rng.js"></script>
  <script src="../js/world/biomas.js"></script>
  <script src="../js/world/mundo.js"></script>
  <script src="auditor.js"></script>
</body>
</html>
