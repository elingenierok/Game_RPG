<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba · Cámara Central · v3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #ddd;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    color: #6cf;
    margin-bottom: 20px;
    font-size: 18px;
  }

  #pantalla {
    background: #111;
    border: 2px solid #333;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(100,200,255,0.15);
    position: relative;
    overflow: hidden;
  }

  /* Contenedor del mundo: es MÁS GRANDE que el viewport.
     Se desplaza con translate. */
  #mundo {
    position: absolute;
    top: 0;
    left: 0;
    display: grid;
    font-size: 14px;
    line-height: 1;
    will-change: transform;
  }

  #mundo .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
  }

  /* El jugador está SIEMPRE en el centro del viewport. No se mueve. */
  #jugador {
    position: absolute;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    pointer-events: none;
    z-index: 10;
  }

  #hud {
    margin-top: 15px;
    font-size: 13px;
    color: #888;
  }

  #hud strong { color: #6cf; }

  .ayuda {
    margin-top: 15px;
    font-size: 12px;
    color: #666;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>🌍 Prueba · Cámara Central · v3 · Jugador Fijo</h1>

<div id="pantalla">
  <div id="mundo"></div>
  <div id="jugador">🏃‍♂️</div>
</div>

<div id="hud">
  🧑 Pos: <strong id="pos">0,0</strong> ·
  Cámara: <strong id="cam">0.00, 0.00</strong> ·
  Chunk: <strong id="chunk">0</strong>
</div>

<div class="ayuda">
  <strong>WASD</strong> o <strong>flechas</strong> · Mantené la tecla<br>
  El mundo se desplaza suavemente · El jugador queda fijo en el centro
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIGURACIÓN
// ═══════════════════════════════════════════════════════════════
const ANCHO_VENTANA = 25;
const ALTO_VENTANA  = 17;
const TAMANO_CELDA  = 16;
const ANCHO_MUNDO   = 125;
const ALTO_MUNDO    = 17;

const DURACION_MOVIMIENTO = 400;

// ═══════════════════════════════════════════════════════════════
//  TILES
// ═══════════════════════════════════════════════════════════════
const T = {
  GRASS: "🟩", TREE: "🌳", WATER: "🌊", SAND: "🟨",
  WALL: "🧱", PLAYER: "🏃‍♂️",
};
const BLOQUEANTES = new Set([T.TREE, T.WATER, T.WALL]);

// ═══════════════════════════════════════════════════════════════
//  GENERACIÓN DEL MUNDO
// ═══════════════════════════════════════════════════════════════
function generarMundo() {
  const mundo = [];
  for (let y = 0; y < ALTO_MUNDO; y++) {
    const fila = [];
    for (let x = 0; x < ANCHO_MUNDO; x++) {
      const chunk = Math.floor(x / ANCHO_VENTANA);
      const r = Math.random();
      let tile = T.GRASS;

      if (chunk === 0) {
        if (r < 0.10) tile = T.TREE;
        else if (r < 0.15) tile = T.SAND;
      } else if (chunk === 1) {
        if (r < 0.30) tile = T.TREE;
      } else if (chunk === 2) {
        const cx = 25 * 2 + 12;
        const cy = Math.floor(ALTO_MUNDO / 2);
        const dist = Math.abs(x - cx) + Math.abs(y - cy);
        if (dist < 6) tile = T.WATER;
        else if (dist < 8) tile = T.SAND;
      } else if (chunk === 3) {
        if (r < 0.15) tile = T.WALL;
      } else if (chunk === 4) {
        if (r < 0.20) tile = T.WATER;
        else if (r < 0.40) tile = T.SAND;
      }
      fila.push(tile);
    }
    mundo.push(fila);
  }
  for (let x = 0; x < ANCHO_MUNDO; x++) {
    mundo[0][x] = T.WALL;
    mundo[ALTO_MUNDO - 1][x] = T.WALL;
  }
  return mundo;
}
const mundo = generarMundo();

// ═══════════════════════════════════════════════════════════════
//  ESTADO
// ═══════════════════════════════════════════════════════════════
const jugador = {
  x: 12, y: 8,
  animando: false,
  animInicioX: 0, animInicioY: 0,
  animFinX: 0, animFinY: 0,
  animInicio: 0,
  teclasApretadas: { arriba: false, abajo: false, izquierda: false, derecha: false },
};

// La cámara indica qué columna/fila del mundo está en el centro
// del viewport. Es la posición del jugador en sub-tile (con decimales).
const camara = {
  x: jugador.x,
  y: jugador.y,
};

// ═══════════════════════════════════════════════════════════════
//  LAYOUT DEL VIEWPORT
// ═══════════════════════════════════════════════════════════════
const anchoViewportPx = ANCHO_VENTANA * TAMANO_CELDA;
const altoViewportPx  = ALTO_VENTANA * TAMANO_CELDA;

const pantalla = document.getElementById("pantalla");
pantalla.style.width  = anchoViewportPx + "px";
pantalla.style.height = altoViewportPx + "px";

// Posición del jugador: centro exacto
const jugadorDiv = document.getElementById("jugador");
jugadorDiv.style.left = (anchoViewportPx / 2 - TAMANO_CELDA / 2) + "px";
jugadorDiv.style.top  = (altoViewportPx / 2 - TAMANO_CELDA / 2) + "px";

// ═══════════════════════════════════════════════════════════════
//  CONSTRUIR EL MUNDO VISUAL (con 2 copias para el wrap)
// ═══════════════════════════════════════════════════════════════
//  Creamos una grilla del doble del ancho del mundo. La primera
//  mitad es el mundo normal, la segunda mitad es una COPIA. Así,
//  cuando el jugador cruza el borde, se ve el mundo de la copia
//  al lado y no hay salto visual.
// ═══════════════════════════════════════════════════════════════
const divMundo = document.getElementById("mundo");
const ANCHO_MUNDO_VISUAL = ANCHO_MUNDO * 2;   // 250 columnas

divMundo.style.gridTemplateColumns = `repeat(${ANCHO_MUNDO_VISUAL}, ${TAMANO_CELDA}px)`;
divMundo.style.gridTemplateRows = `repeat(${ALTO_MUNDO}, ${TAMANO_CELDA}px)`;

for (let y = 0; y < ALTO_MUNDO; y++) {
  for (let x = 0; x < ANCHO_MUNDO_VISUAL; x++) {
    const worldX = x % ANCHO_MUNDO;
    const tile = mundo[y][worldX];
    const c = document.createElement("div");
    c.className = "tile";
    c.textContent = tile;
    divMundo.appendChild(c);
  }
}

// ═══════════════════════════════════════════════════════════════
//  LÓGICA DE MOVIMIENTO
// ═══════════════════════════════════════════════════════════════
function puedeMoverseHacia(x, y) {
  let wrappedX = x % ANCHO_MUNDO;
  if (wrappedX < 0) wrappedX += ANCHO_MUNDO;
  if (y < 0 || y >= ALTO_MUNDO) return null;
  const tile = mundo[y][wrappedX];
  if (BLOQUEANTES.has(tile)) return null;
  return { x: wrappedX, y: y };
}

function iniciarMovimiento(dx, dy) {
  if (jugador.animando) return;

  const destino = puedeMoverseHacia(jugador.x + dx, jugador.y + dy);
  if (!destino) return;

  jugador.animando = true;

  jugador.animInicioX = camara.x;
  jugador.animInicioY = camara.y;
  jugador.animFinX = camara.x + dx;
  jugador.animFinY = camara.y + dy;
  jugador.animInicio = performance.now();

  jugador.x = destino.x;
  jugador.y = destino.y;
}

function actualizarAnimacion() {
  if (!jugador.animando) {
    if (jugador.teclasApretadas.arriba)         iniciarMovimiento(0, -1);
    else if (jugador.teclasApretadas.abajo)     iniciarMovimiento(0, +1);
    else if (jugador.teclasApretadas.izquierda) iniciarMovimiento(-1, 0);
    else if (jugador.teclasApretadas.derecha)   iniciarMovimiento(+1, 0);
    return;
  }

  const t = Math.min(1, (performance.now() - jugador.animInicio) / DURACION_MOVIMIENTO);

  camara.x = jugador.animInicioX + (jugador.animFinX - jugador.animInicioX) * t;
  camara.y = jugador.animInicioY + (jugador.animFinY - jugador.animInicioY) * t;

  // Wrap de la cámara en X
  if (camara.x < 0) camara.x += ANCHO_MUNDO;
  if (camara.x >= ANCHO_MUNDO) camara.x -= ANCHO_MUNDO;

  if (t >= 1) {
    jugador.animando = false;
  }
}

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════
function render() {
  // La cámara está en la posición del jugador.
  // Queremos que el jugador esté centrado: la esquina superior
  // izquierda del mundo visible debe estar en (camara.x - centroX).
  const centroX = Math.floor(ANCHO_VENTANA / 2);
  const centroY = Math.floor(ALTO_VENTANA / 2);

  // Posición de la esquina superior izquierda (con decimales)
  let esquinaX = camara.x - centroX;
  const esquinaY = camara.y - centroY;

  // Wrap: la esquina debe caer dentro del rango [0, ANCHO_MUNDO)
  if (esquinaX < 0) esquinaX += ANCHO_MUNDO;
  if (esquinaX >= ANCHO_MUNDO) esquinaX -= ANCHO_MUNDO;

  // Desplazamiento en píxeles del mundo visual
  const offsetPxX = -esquinaX * TAMANO_CELDA;
  const offsetPxY = -esquinaY * TAMANO_CELDA;

  divMundo.style.transform = `translate(${offsetPxX}px, ${offsetPxY}px)`;

  // HUD
  document.getElementById("pos").textContent = `${jugador.x},${jugador.y}`;
  document.getElementById("cam").textContent =
    `${camara.x.toFixed(2)}, ${camara.y.toFixed(2)}`;
  document.getElementById("chunk").textContent = Math.floor(jugador.x / ANCHO_VENTANA);
}

// ═══════════════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════════════
function loop() {
  actualizarAnimacion();
  render();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════════
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "w" || k === "arrowup")    jugador.teclasApretadas.arriba = true;
  if (k === "s" || k === "arrowdown")  jugador.teclasApretadas.abajo = true;
  if (k === "a" || k === "arrowleft")  jugador.teclasApretadas.izquierda = true;
  if (k === "d" || k === "arrowright") jugador.teclasApretadas.derecha = true;
});

document.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (k === "w" || k === "arrowup")    jugador.teclasApretadas.arriba = false;
  if (k === "s" || k === "arrowdown")  jugador.teclasApretadas.abajo = false;
  if (k === "a" || k === "arrowleft")  jugador.teclasApretadas.izquierda = false;
  if (k === "d" || k === "arrowright") jugador.teclasApretadas.derecha = false;
});

// ═══════════════════════════════════════════════════════════════
//  INICIO
// ═══════════════════════════════════════════════════════════════
loop();
</script>

</body>
</html>
