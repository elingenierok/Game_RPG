<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba · Barra de Timing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #ddd; font-family: monospace; padding: 20px; min-height: 100vh; }
  h1 { color: #6cf; font-size: 18px; margin-bottom: 6px; }
  .subt { font-size: 12px; color: #777; margin-bottom: 24px; max-width: 600px; line-height: 1.6; }
  #btn-iniciar { background: #1a1a1a; border: 1px solid #6cf; color: #6cf; padding: 12px 24px; border-radius: 6px; font-family: monospace; font-size: 13px; cursor: pointer; }
  #btn-iniciar:hover { background: #6cf; color: #0a0a0a; box-shadow: 0 0 16px rgba(102, 204, 255, 0.6); }
  #btn-iniciar:disabled { opacity: 0.4; cursor: not-allowed; }
  #resultados { margin-top: 24px; padding: 12px; background: #111; border: 1px solid #222; border-radius: 6px; max-width: 600px; }
  #resultados h2 { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  #resultados .fila { padding: 6px 0; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
  .pct { color: #6cf; font-weight: bold; }
  .perfecto { color: #5c5; }
  .aceptable { color: #e85; }
  .fallo { color: #d33; }
  #barra-timing-overlay {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0, 0, 0, 0.7); display: flex;
    align-items: center; justify-content: center;
    z-index: 500; cursor: pointer;
  }
  #barra-timing-panel {
    background: #111; border: 2px solid #6cf; border-radius: 12px;
    padding: 24px 32px; box-shadow: 0 0 32px rgba(102, 204, 255, 0.4);
    min-width: 440px; text-align: center;
  }
  #barra-timing-panel.perfecto { border-color: #5c5; box-shadow: 0 0 32px rgba(85, 204, 85, 0.7); }
  #barra-timing-panel.aceptable { border-color: #e85; box-shadow: 0 0 32px rgba(238, 136, 85, 0.7); }
  #barra-timing-panel.fallo { border-color: #d33; box-shadow: 0 0 32px rgba(221, 51, 51, 0.7); }
  #barra-timing-titulo { font-size: 16px; color: #6cf; margin-bottom: 20px; font-weight: bold; }
  #barra-timing-barra {
    position: relative; width: 100%; height: 40px;
    background: #0a0a0a; border: 2px solid #333;
    border-radius: 6px; overflow: hidden; margin-bottom: 14px; display: flex;
  }
  #barra-timing-barra .zona { height: 100%; }
  .zona.roja-izq    { width: 25%; background: rgba(221, 51, 51, 0.6); }
  .zona.naranja-izq { width: 15%; background: rgba(238, 136, 85, 0.7); }
  .zona.verde       { width: 20%; background: rgba(85, 204, 85, 0.8); }
  .zona.naranja-der { width: 15%; background: rgba(238, 136, 85, 0.7); }
  .zona.roja-der    { width: 25%; background: rgba(221, 51, 51, 0.6); }
  #barra-timing-marcador {
    position: absolute; top: 0; width: 4px; height: 100%;
    background: #fff; box-shadow: 0 0 8px #fff, 0 0 16px #6cf;
    left: 0%; transform: translateX(-2px); pointer-events: none;
  }
  #barra-timing-hint { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 2px; }
</style>
</head>
<body>

<h1>🎯 Prueba · Barra de Timing</h1>
<div class="subt">
  Apretá <strong>Iniciar</strong> y esperá a que el marcador pase por el centro (zona verde).<br>
  Apretá <strong>Espacio</strong> (o click en el panel) en el momento justo.
</div>

<button id="btn-iniciar">Iniciar barra</button>

<div id="resultados">
  <h2>Historial</h2>
</div>

<script>
"use strict";

window.BarraTiming = (() => {
  let activo = false, inicio = 0, duracion = 1500;
  let onResultado = null, frameId = null, teclaHandler = null;
  let contenedor = null, marcador = null;

  function iniciar(opciones) {
    if (activo) return;
    activo = true;
    duracion = opciones.duracionMs || 1500;
    onResultado = opciones.onResultado || (() => {});
    crearUI(opciones.titulo || "¡Apretá Espacio!");
    inicio = performance.now();
    animar();
    teclaHandler = (e) => {
      if (e.code === "Space" || e.key === " ") { e.preventDefault(); apretar(); }
    };
    document.addEventListener("keydown", teclaHandler);
  }

  function crearUI(titulo) {
    contenedor = document.createElement("div");
    contenedor.id = "barra-timing-overlay";
    contenedor.innerHTML = `
      <div id="barra-timing-panel">
        <div id="barra-timing-titulo">${titulo}</div>
        <div id="barra-timing-barra">
          <div class="zona roja-izq"></div>
          <div class="zona naranja-izq"></div>
          <div class="zona verde"></div>
          <div class="zona naranja-der"></div>
          <div class="zona roja-der"></div>
          <div id="barra-timing-marcador"></div>
        </div>
        <div id="barra-timing-hint">Espacio para apretar</div>
      </div>
    `;
    document.body.appendChild(contenedor);
    marcador = document.getElementById("barra-timing-marcador");
    contenedor.addEventListener("click", (e) => { e.stopPropagation(); apretar(); });
  }

  function animar() {
    if (!activo) return;
    const transcurrido = performance.now() - inicio;
    const progreso = Math.min(1, transcurrido / duracion);
    if (marcador) marcador.style.left = (progreso * 100) + "%";
    if (progreso >= 1) { terminar(0); return; }
    frameId = requestAnimationFrame(animar);
  }

  function apretar() {
    if (!activo) return;
    const transcurrido = performance.now() - inicio;
    const posicion = Math.min(100, (transcurrido / duracion) * 100);
    const distanciaAlCentro = Math.abs(posicion - 50);
    const precision = Math.max(0, 1 - distanciaAlCentro / 50);
    terminar(precision);
  }

  function terminar(precision) {
    activo = false;
    if (frameId) { cancelAnimationFrame(frameId); frameId = null; }
    if (teclaHandler) { document.removeEventListener("keydown", teclaHandler); teclaHandler = null; }
    const panel = document.getElementById("barra-timing-panel");
    if (panel) panel.classList.add(claseDePrecision(precision));
    setTimeout(() => {
      if (contenedor && contenedor.parentNode) contenedor.parentNode.removeChild(contenedor);
      contenedor = null; marcador = null;
      onResultado(precision);
    }, 400);
  }

  function claseDePrecision(p) {
    if (p >= 0.8) return "perfecto";
    if (p >= 0.4) return "aceptable";
    return "fallo";
  }

  return { iniciar };
})();

const btn = document.getElementById("btn-iniciar");
const divResultados = document.getElementById("resultados");
let contador = 0;
const historial = [];

btn.addEventListener("click", () => {
  btn.disabled = true;
  BarraTiming.iniciar({
    duracionMs: 1500,
    titulo: "¡Apretá Espacio!",
    onResultado: (precision) => {
      contador++;
      historial.unshift({ n: contador, p: precision });
      if (historial.length > 10) historial.pop();
      renderHistorial();
      btn.disabled = false;
    }
  });
});

function renderHistorial() {
  const clase = (p) => p >= 0.8 ? "perfecto" : p >= 0.4 ? "aceptable" : "fallo";
  const filas = historial.map(({ n, p }) => `
    <div class="fila">
      #${n} · Precisión: <span class="pct">${(p * 100).toFixed(0)}%</span> · <span class="${clase(p)}">${clase(p)}</span>
    </div>
  `).join("");
  divResultados.innerHTML = `<h2>Historial</h2>${filas}`;
}
</script>

</body>
</html>
