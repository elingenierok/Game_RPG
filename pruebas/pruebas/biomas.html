<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba · Escala de biomas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #ddd;
    font-family: monospace;
    padding: 20px;
  }
  h1 {
    font-size: 18px;
    color: #6cf;
    margin-bottom: 4px;
    text-shadow: 0 0 8px rgba(102, 204, 255, 0.4);
  }
  .subt {
    font-size: 11px;
    color: #666;
    margin-bottom: 16px;
  }

  .controles {
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
  }
  .controles label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
    color: #888;
  }
  .controles input[type="range"] {
    width: 320px;
    accent-color: #6cf;
  }
  .controles .valor {
    font-size: 14px;
    color: #6cf;
    font-weight: bold;
  }
  .controles .info {
    font-size: 12px;
    color: #aaa;
    line-height: 1.6;
    max-width: 340px;
  }
  .controles .info b { color: #f4a; }
  .controles .info .ok { color: #6cf; }

  .controles button {
    background: #1a1a1a;
    border: 1px solid #6cf;
    color: #6cf;
    padding: 6px 14px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 12px;
    cursor: pointer;
  }
  .controles button:hover { background: #6cf; color: #0a0a0a; }

  .panel {
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 12px;
    color: #6cf;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .panel p {
    font-size: 11px;
    color: #777;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  .mapa-wrapper {
    position: relative;
    display: inline-block;
    background: #000;
    border: 1px solid #333;
    border-radius: 4px;
    overflow: hidden;
  }
  .grid {
    display: grid;
    gap: 0;
  }
  .celda {
    width: 8px;
    height: 8px;
  }
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }
  .overlay .linea {
    position: absolute;
    background: rgba(255, 68, 170, 0.6);
  }
  .overlay .linea-h {
    left: 0;
    right: 0;
    height: 1px;
  }
  .overlay .linea-v {
    top: 0;
    bottom: 0;
    width: 1px;
  }

  .leyenda {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 10px;
    font-size: 10px;
    color: #777;
  }
  .leyenda span { display: flex; align-items: center; gap: 4px; }
  .leyenda .muestra {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    display: inline-block;
  }
</style>
</head>
<body>

<h1>📐 Prueba · Escala de biomas</h1>
<div class="subt">
  Mapa de 512×512 celdas. Cada cuadro rosa es 1 chunk (32×32). Movés el slider y ves cuántos biomas entran por chunk.
</div>

<div class="controles">
  <label>
    Escala de bioma (más bajo = biomas más grandes)
    <input type="range" id="slider-escala" min="0.002" max="0.05" step="0.001" value="0.008">
  </label>
  <div class="valor"><span id="valor-escala">0.008</span></div>

  <div class="info" id="info">
    Cargando...
  </div>

  <label>
    Semilla
    <input type="text" id="input-semilla" value="test_01" style="background:#0a0a0a;border:1px solid #333;color:#ddd;padding:4px 8px;border-radius:4px;font-family:monospace;font-size:12px;width:140px;">
  </label>
  <button id="btn-random">🎲</button>
</div>

<div class="panel">
  <h2>Mapa con chunk grid</h2>
  <p>Los cuadros rosas marcan cada 32 celdas (1 chunk del juego). Los biomas son las manchas de color.</p>
  <div class="mapa-wrapper" id="wrapper">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="leyenda" id="leyenda"></div>
</div>

<script>
// ═══ Config ═══
const LADO = 512;             // celdas por lado (512×512 = 16×16 chunks)
const TAM_CELDA = 1;          // px por celda (1px = mapa compacto)
const CHUNK = 32;             // celdas por chunk (igual que el juego)
let SEMILLA = "test_01";

const BIOMAS = [
  { id: "pradera",   color: "#3a6b3a" },
  { id: "bosque",    color: "#1f4a1f" },
  { id: "desierto",  color: "#b8a14a" },
  { id: "nieve",     color: "#c8d8e8" },
  { id: "oceano",    color: "#2a4a7a" },
  { id: "montaña",   color: "#5a4a3a" },
];

// ═══ Ruido ═══
function hash(x, y, seed) {
  let h = 2166136261 ^ seed;
  h = Math.imul(h ^ x, 16777619);
  h = Math.imul(h ^ y, 16777619);
  h ^= h >>> 13;
  h = Math.imul(h, 16777619);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}

function seedANumero(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h << 5) - h + s.charCodeAt(i);
    h |= 0;
  }
  return h;
}

function smoothstep(t) {
  return t * t * (3 - 2 * t);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function ruido(x, y, seed) {
  const x0 = Math.floor(x);
  const y0 = Math.floor(y);
  const x1 = x0 + 1;
  const y1 = y0 + 1;

  const v00 = hash(x0, y0, seed);
  const v10 = hash(x1, y0, seed);
  const v01 = hash(x0, y1, seed);
  const v11 = hash(x1, y1, seed);

  const tx = smoothstep(x - x0);
  const ty = smoothstep(y - y0);

  const a = lerp(v00, v10, tx);
  const b = lerp(v01, v11, tx);
  return lerp(a, b, ty);
}

function biomaPorTempHum(temp, hum) {
  let mejor = BIOMAS[0];
  let mejorDist = Infinity;
  for (const b of BIOMAS) {
    const t = temp - (b.id === "nieve" ? 0.1 : b.id === "desierto" ? 0.9 : 0.5);
    const h = hum  - (b.id === "oceano" ? 0.95 : b.id === "bosque" ? 0.8 : 0.5);
    const d = t * t + h * h;
    if (d < mejorDist) {
      mejorDist = d;
      mejor = b;
    }
  }
  return mejor;
}

function biomaEn(wx, wy, seed, escala) {
  const temp = ruido(wx * escala, wy * escala, seed);
  const hum  = ruido(wx * escala + 1000, wy * escala + 1000, seed + 100);
  return biomaPorTempHum(temp, hum);
}

// ═══ Render ═══
const grid    = document.getElementById("grid");
const overlay = document.getElementById("overlay");
const wrapper = document.getElementById("wrapper");
const leyenda = document.getElementById("leyenda");

function setupGrid() {
  grid.style.gridTemplateColumns = `repeat(${LADO}, ${TAM_CELDA}px)`;
  grid.innerHTML = "";
  for (let i = 0; i < LADO * LADO; i++) {
    const c = document.createElement("div");
    c.className = "celda";
    c.style.width  = TAM_CELDA + "px";
    c.style.height = TAM_CELDA + "px";
    grid.appendChild(c);
  }
}

function dibujarOverlay() {
  overlay.innerHTML = "";
  const total = LADO * TAM_CELDA;

  // Líneas verticales cada 32 celdas
  for (let x = 0; x <= LADO; x += CHUNK) {
    const l = document.createElement("div");
    l.className = "linea linea-v";
    l.style.left = (x * TAM_CELDA) + "px";
    l.style.width = "1px";
    l.style.height = total + "px";
    overlay.appendChild(l);
  }
  // Líneas horizontales cada 32 celdas
  for (let y = 0; y <= LADO; y += CHUNK) {
    const l = document.createElement("div");
    l.className = "linea linea-h";
    l.style.top = (y * TAM_CELDA) + "px";
    l.style.height = "1px";
    l.style.width = total + "px";
    overlay.appendChild(l);
  }
}

function dibujarMapa() {
  const seed = seedANumero(SEMILLA);
  const escala = parseFloat(document.getElementById("slider-escala").value);
  const celdas = grid.children;

  for (let y = 0; y < LADO; y++) {
    for (let x = 0; x < LADO; x++) {
      const b = biomaEn(x, y, seed, escala);
      celdas[y * LADO + x].style.background = b.color;
    }
  }

  actualizarInfo(escala);
  dibujarLeyenda();
}

function actualizarInfo(escala) {
  // El tamaño del bioma en celdas es aproximadamente 1/escala
  const tamanoBioma = Math.round(1 / escala);
  const chunksPorBioma = (tamanoBioma / CHUNK).toFixed(1);

  let tipo = "";
  let clase = "";
  if (tamanoBioma < CHUNK) {
    tipo = "🔴 MOSAICO · el bioma cambia más rápido que un chunk. Vas a ver 2-3 biomas por chunk.";
    clase = "rojo";
  } else if (tamanoBioma < CHUNK * 2) {
    tipo = "🟡 REGIONES · el bioma es comparable al chunk. Cada chunk es casi 1 bioma.";
  } else if (tamanoBioma < CHUNK * 4) {
    tipo = "🟢 CONTINENTES · el bioma abarca 2-4 chunks. Zonas grandes y coherentes.";
  } else {
    tipo = "🔵 MEGA-CONTINENTES · el bioma abarca muchos chunks. Mundo muy homogéneo.";
  }

  document.getElementById("info").innerHTML = `
    <div>1 bioma ≈ <b>${tamanoBioma} celdas</b> = <b>${chunksPorBioma} chunks</b></div>
    <div style="margin-top:6px">${tipo}</div>
  `;
}

function dibujarLeyenda() {
  leyenda.innerHTML = "";
  for (const b of BIOMAS) {
    const span = document.createElement("span");
    span.innerHTML = `<span class="muestra" style="background:${b.color}"></span> ${b.id}`;
    leyenda.appendChild(span);
  }
}

// ═══ Eventos ═══
setupGrid();
dibujarOverlay();

document.getElementById("slider-escala").addEventListener("input", (e) => {
  document.getElementById("valor-escala").textContent = e.target.value;
  dibujarMapa();
});

document.getElementById("input-semilla").addEventListener("input", (e) => {
  SEMILLA = e.target.value || "test_01";
  dibujarMapa();
});

document.getElementById("btn-random").addEventListener("click", () => {
  const s = "mundo_" + Math.floor(Math.random() * 999999);
  document.getElementById("input-semilla").value = s;
  SEMILLA = s;
  dibujarMapa();
});

dibujarMapa();
</script>

</body>
</html>
